# ============================================================
#  Render.com Blueprint Specification
#  Website: Raízes e Rotas — Monsenhor Hipólito, Piauí
#  CETIJAB · Professora Jordana Yrla
# ============================================================

services:
  # ────────────────────────────────────────────────────────────
  # OPÇÃO 1 (RECOMENDADA): STATIC SITE
  # Ideal para Render Free: 100% de disponibilidade, CDN global,
  # certificados SSL automáticos e sem hibernação.
  # ────────────────────────────────────────────────────────────
  - type: web
    name: raizes-e-rotas-monsenhor-hipolito
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ────────────────────────────────────────────────────────────
  # OPÇÃO 2: DOCKER WEB SERVICE
  # Use caso prefira executar o container Nginx customizado no Render.
  # Para ativar, descomente o bloco abaixo no Render Blueprint:
